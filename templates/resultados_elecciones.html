<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultados de Elecciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>📊 Resultados de las Elecciones</h2>
    <div class="list-group mt-4">
        {% for eleccion in elecciones %}
        <div class="list-group-item d-flex justify-content-between align-items-center">
            <div>
                <strong>{{ eleccion.nombre }}</strong><br>
                <span class="text-muted">{{ eleccion.tipo_representacion.capitalize() }}</span>
            </div>
            <a href="{{ url_for('ver_resultado_eleccion', eleccion_id=eleccion.id) }}" class="btn btn-primary">Ver Resultados</a>
        </div>
        {% else %}
        <p>No hay elecciones registradas.</p>
        {% endfor %}
    </div>
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary mt-4">← Volver</a>
</div>
</body>
</html>
